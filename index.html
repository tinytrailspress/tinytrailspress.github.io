<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny Trails Press · Activity books for curious kids</title>
<meta name="description" content="Tiny Trails Press makes maze, puzzle and coloring activity books for kids ages 4 to 8.">
<link rel="icon" href="/zibbo.png">
<style>
  :root { --ink:#1f2a24; --green:#264634; --leaf:#3f7a55; --sand:#fbf7ef; --line:#e6dfd0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: ui-rounded, "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif; color:var(--ink); background:var(--sand); line-height:1.5; }
  .wrap { max-width:880px; margin:0 auto; padding:40px 20px; text-align:center; }
  h1 { font-size:clamp(2rem, 6vw, 3rem); color:var(--green); margin:10px 0 4px; }
  .lead { font-size:1.2rem; max-width:560px; margin:0 auto 26px; }
  .chars { display:flex; justify-content:center; gap:30px; flex-wrap:wrap; margin:20px 0 30px; }
  .chars figure { margin:0; }
  .chars img { height:160px; }
  .chars figcaption { font-weight:700; color:var(--green); }
  .btn { display:inline-block; background:var(--leaf); color:#fff; text-decoration:none; font-weight:800; font-size:1.1rem; padding:15px 26px; border-radius:14px; }
  .btn:hover, .btn:focus { background:var(--green); }
  p.note { margin-top:26px; }
  footer { border-top:2px solid var(--line); margin-top:40px; padding-top:20px; font-size:.95rem; color:#5b6560; }
  a { color:var(--leaf); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Tiny Trails Press</h1>
  <p class="lead">Maze, puzzle and coloring activity books for curious kids ages 4 to 8.</p>
  <div class="chars">
    <figure><img src="/zibbo.png" alt="Zibbo the Triceratops"><figcaption>Zibbo the Triceratops</figcaption></figure>
    <figure><img src="/bucky.png" alt="Bucky the Excavator"><figcaption>Bucky the Excavator</figcaption></figure>
  </div>
  <a class="btn" href="/bonus">Get your free bonus printables</a>
  <p class="note">Find our books on Amazon by searching <strong>Tiny Trails Press</strong>.</p>
  <footer>
    <a href="mailto:hello@tinytrailspress.com">hello@tinytrailspress.com</a> · © 2026 Tiny Trails Press
  </footer>
</div>
</body>
</html>
